<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34508a"/>
      <stop offset="1" stop-color="#18223d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="sheet">
      <rect x="282" y="226" width="420" height="550" rx="40"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS icon body: 824px rounded square on the 1024 grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <circle cx="820" cy="190" r="260" fill="#fff" opacity="0.05" clip-path="url(#body)"/>

  <!-- Release notes page -->
  <g filter="url(#shadow)">
    <rect x="282" y="226" width="420" height="550" rx="40" fill="#fff"/>
  </g>
  <g clip-path="url(#sheet)">
    <rect x="282" y="226" width="420" height="124" fill="url(#band)"/>
  </g>
  <rect x="322" y="266" width="190" height="24" rx="12" fill="#fff" opacity="0.95"/>
  <rect x="322" y="304" width="116" height="16" rx="8" fill="#fff" opacity="0.6"/>

  <!-- Section rows: features, improvements, fixes -->
  <circle cx="338" cy="418" r="16" fill="#3b82f6"/>
  <rect x="372" y="408" width="270" height="20" rx="10" fill="#dfe5ee"/>
  <rect x="372" y="440" width="196" height="14" rx="7" fill="#eef2f7"/>

  <circle cx="338" cy="520" r="16" fill="#22c55e"/>
  <rect x="372" y="510" width="240" height="20" rx="10" fill="#dfe5ee"/>
  <rect x="372" y="542" width="210" height="14" rx="7" fill="#eef2f7"/>

  <circle cx="338" cy="622" r="16" fill="#a855f7"/>
  <rect x="372" y="612" width="200" height="20" rx="10" fill="#dfe5ee"/>
  <rect x="372" y="644" width="150" height="14" rx="7" fill="#eef2f7"/>

  <!-- Resolved badge -->
  <g filter="url(#shadow)">
    <circle cx="700" cy="726" r="118" fill="url(#badge)" stroke="#fff" stroke-width="18"/>
  </g>
  <path d="M640 728 L684 770 L762 686" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
